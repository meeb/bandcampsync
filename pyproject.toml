[tool.poetry]
name = "bandcampsync"
version = "0.8.0"
description = "A Python module and script to synchronise media purchased on bandcamp.com with a local directory."
authors = [
  "meeb <meeb@meeb.org>",
  "Nick Johnson <nicholas.anthony.j@gmail.com>",
]
readme = "README.md"
license = "BSD-3-Clause"
packages = [{include = "bandcampsync"}]
homepage = "https://github.com/newplasticideas/bandcampsync"
repository = "https://github.com/newplasticideas/bandcampsync.git"
keywords = ["bandcampsync", "bandcamp", "media", "sync"]

[tool.poetry.dependencies]
python = "^3.10"
beautifulsoup4 = "^4.14.3"
curl-cffi = "^0.14.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-mock = "^3.15.1"
pytest-cov = "^7.1.0"
pre-commit = "^4.6.2"
ruff = "^0.14.3"
mypy = "^1.11"

[tool.poetry.scripts]
bandcampsync-service = "bandcampsync.interface.service.entrypoint:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4", "RUF", "PERF", "PIE", "PTH", "S", "TRY"]
ignore = [
    "S603",   # subprocess call - not user-controlled
    "S607",   # partial executable path
    "TRY003", # long exception messages inline - acceptable for this codebase
    "N818",   # exception names without an "Error" suffix - inherited from upstream's public API
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S310", "S108"]

[tool.mypy]
files = ["bandcampsync"]
python_version = "3.10"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["bandcampsync"]
relative_files = true

[tool.coverage.report]
show_missing = true
