repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: poetry run ruff format
        language: system
        types: [python]

      - id: ruff-check
        name: ruff check
        entry: poetry run ruff check --fix
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: poetry run mypy bandcampsync/
        language: system
        types: [python]
        pass_filenames: false

