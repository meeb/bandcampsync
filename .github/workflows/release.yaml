name: Publish a BandcampSync release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:

  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check the release tag matches the package versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(uv version --short)"
          if [ "${RELEASE_TAG#v}" != "${package_version}" ]; then
            echo "Release tag ${RELEASE_TAG} does not match package version ${package_version}"
            exit 1
          fi
          config_version="$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' bandcampsync/config.py)"
          if [ "${config_version}" != "${package_version}" ]; then
            echo "bandcampsync/config.py version ${config_version} does not match package version ${package_version}"
            exit 1
          fi
      - name: Build
        run: uv build
      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish

  containerise:
    needs: publish
    uses: ./.github/workflows/container.yml
    with:
      tag: ${{ github.event.release.tag_name }}
      version: ${{ github.event.release.tag_name }}
    secrets:
      registry-token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
