name: Test BandcampSync and build the latest container

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:

  test:
    uses: ./.github/workflows/test.yml

  containerise:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/container.yml
    with:
      tag: latest
      version: ${{ github.sha }}
    secrets:
      registry-token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
